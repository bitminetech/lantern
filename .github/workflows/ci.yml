# Generate the consensus-spec-tests vectors, build every target with the pinned
# toolchain, then run every vector file on each of the 7 supported targets
# (ARCHITECTURE.md sections 1, 4 and 7). RISC-V runs under QEMU. The -bls-off
# runners run the cases made with signature checks off (tests/runner/bls_off.c).
# tests/runner/run.sh and run.ps1 run one process per runner and file on each core.
# The vectors are large, so a cache keyed by the generator holds them for every job.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      vectors-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: key
        run: echo "key=vectors-${{ hashFiles('tests/generator/*') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the vectors
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
      - name: Build the image
        run: docker build -q -t lantern-build -f platform/linux/Dockerfile platform/linux
      - name: Generate the vectors
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          tests/generator/run.sh "$RUNNER_TEMP/generator"
          mkdir -p vectors
          mv "$RUNNER_TEMP"/generator/*.bin vectors/
      - name: Save the vectors
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
      - name: Build all targets
        run: docker run --rm -v "$PWD:/src" lantern-build platform/build-all.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build
          path: |
            build/
            !build/deps/

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # RISC-V runs under QEMU, so its vector files are split over two jobs.
        include:
          - { isa: x86_64,  runs-on: ubuntu-24.04,     qemu: "",           part: all }
          - { isa: arm64,   runs-on: ubuntu-24.04-arm, qemu: "",           part: all }
          - { isa: riscv64, runs-on: ubuntu-24.04-arm, qemu: qemu-riscv64, part: compliance }
          - { isa: riscv64, runs-on: ubuntu-24.04-arm, qemu: qemu-riscv64, part: rest }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: ${{ needs.build.outputs.vectors-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Run vectors
        run: |
          set -o pipefail
          case "${{ matrix.part }}" in
            compliance) files=$(cd vectors && ls *.bin | grep fork_choice_compliance) ;;
            rest)       files=$(cd vectors && ls *.bin | grep -v fork_choice_compliance) ;;
            *)          files=$(cd vectors && ls *.bin) ;;
          esac
          chmod +x build/linux-${{ matrix.isa }}/runner-*
          QEMU="${{ matrix.qemu }}" tests/runner/run.sh build/linux-${{ matrix.isa }} vectors $files \
            | tee results-linux-${{ matrix.isa }}-${{ matrix.part }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-linux-${{ matrix.isa }}-${{ matrix.part }}
          path: results-linux-${{ matrix.isa }}-${{ matrix.part }}.txt

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: windows-2025 }
          - { isa: arm64,  runs-on: windows-11-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: ${{ needs.build.outputs.vectors-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Run vectors
        shell: pwsh
        run: |
          tests/runner/run.ps1 build/windows-${{ matrix.isa }} vectors | Tee-Object results-windows-${{ matrix.isa }}.txt
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-windows-${{ matrix.isa }}
          path: results-windows-${{ matrix.isa }}.txt

  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: macos-15-intel }
          - { isa: arm64,  runs-on: macos-15 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: ${{ needs.build.outputs.vectors-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Run vectors
        run: |
          set -o pipefail
          tests/runner/macos.sh vectors | tee results-macos-${{ matrix.isa }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-macos-${{ matrix.isa }}
          path: results-macos-${{ matrix.isa }}.txt
