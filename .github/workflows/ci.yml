# Debug only (debug/vccrash): the ARM64 mainnet binary under gdb with teku's and lodestar's
# validator clients (tests/app/devnet.sh, VC=1).
name: ci
on:
  push:
    branches: ['debug/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the ARM64 binary
        run: |
          docker build -q -t lantern-build -f platform/linux/Dockerfile platform/linux
          docker run --rm -v "$PWD:/src" lantern-build sh -eu -c 'platform/deps.sh >/dev/null && platform/linux/build.sh arm64 build/linux-arm64 >/dev/null'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-linux-arm64
          path: build/linux-arm64/lantern-mainnet
  validator:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        client: [prysm, teku]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build-linux-arm64, path: image/linux-arm64 }
      - name: The Kurtosis CLI 1.23.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kurtosis.tar.gz" \
            https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/1.23.0/kurtosis-cli_1.23.0_linux_arm64.tar.gz
          echo "1a1c5eb356eadece5b6a8da9eec1a23bd1cb7f8fdb230d22e89c28b977b798fc  $RUNNER_TEMP/kurtosis.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/kurtosis.tar.gz" -C "$RUNNER_TEMP" kurtosis
          "$RUNNER_TEMP/kurtosis" analytics disable
      - name: ${{ matrix.client }}'s validator client on lantern under gdb
        run: |
          chmod +x image/linux-arm64/lantern-*
          docker build -q -t lantern:gdb -f platform/docker/Dockerfile.gdb image
          LOG_DIR="$RUNNER_TEMP/logs" VC=1 KURTOSIS="$RUNNER_TEMP/kurtosis" tests/app/devnet.sh ${{ matrix.client }} lantern:gdb 1500
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: logs-${{ matrix.client }}
          path: ${{ runner.temp }}/logs
