# Generate the consensus-spec-tests vectors, build every target with the pinned
# toolchain, then run every vector file on each of the 7 supported targets
# (ARCHITECTURE.md sections 1, 4 and 7). RISC-V runs under QEMU. The -bls-off
# runners run the cases made with signature checks off (tests/runner/bls_off.c).
# tests/runner/run.sh and run.ps1 run one process per runner and file on each core.
# The vectors of all forks are too large for one runner's disk, so each fork has
# its own cache, keyed by the generator, and each test job runs one target and
# one fork.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The cache key of the vectors: the hash of the generator, computed once on Linux, since
  # Windows checks files out with other line endings.
  key:
    runs-on: ubuntu-24.04
    outputs:
      generator: ${{ steps.key.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: key
        run: echo "hash=${{ hashFiles('tests/generator/*') }}" >> "$GITHUB_OUTPUT"

  vectors:
    needs: key
    strategy:
      fail-fast: false
      matrix:
        fork: [phase0, altair, bellatrix, capella, deneb, electra, fulu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Restore the vectors
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: vectors-${{ matrix.fork }}-${{ needs.key.outputs.generator }}
          enableCrossOsArchive: true
          lookup-only: true
      - name: Generate the vectors
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          tests/generator/run.sh "$RUNNER_TEMP/generator" ${{ matrix.fork }}
          mkdir -p vectors
          mv "$RUNNER_TEMP"/generator/*.bin vectors/
      - name: Save the vectors
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: vectors-${{ matrix.fork }}-${{ needs.key.outputs.generator }}
          enableCrossOsArchive: true

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build all targets
        run: |
          docker build -q -t lantern-build -f platform/linux/Dockerfile platform/linux
          docker run --rm -v "$PWD:/src" lantern-build platform/build-all.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-linux-x86_64
          path: |
            build/linux-x86_64/runner-*
            build/linux-x86_64/shell-test
            build/linux-x86_64/lantern-minimal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-linux-arm64
          path: |
            build/linux-arm64/runner-*
            build/linux-arm64/shell-test
            build/linux-arm64/lantern-minimal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-linux-riscv64
          path: |
            build/linux-riscv64/runner-*
            build/linux-riscv64/shell-test
            build/linux-riscv64/lantern-minimal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-windows-x86_64
          path: |
            build/windows-x86_64/runner-*
            build/windows-x86_64/shell-test.exe
            build/windows-x86_64/lantern-minimal.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-windows-arm64
          path: |
            build/windows-arm64/runner-*
            build/windows-arm64/shell-test.exe
            build/windows-arm64/lantern-minimal.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-macos-x86_64
          path: |
            build/macos-x86_64/
            !build/macos-x86_64/mainnet/
            !build/macos-x86_64/minimal/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-macos-arm64
          path: |
            build/macos-arm64/
            !build/macos-arm64/mainnet/
            !build/macos-arm64/minimal/

  linux:
    needs: [key, vectors, build]
    strategy:
      fail-fast: false
      matrix:
        fork: [phase0, altair, bellatrix, capella, deneb, electra, fulu]
        isa: [x86_64, arm64, riscv64]
        include:
          - { isa: x86_64,  runs-on: ubuntu-24.04,     qemu: "" }
          - { isa: arm64,   runs-on: ubuntu-24.04-arm, qemu: "" }
          - { isa: riscv64, runs-on: ubuntu-24.04-arm, qemu: qemu-riscv64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: 'build-linux-${{ matrix.isa }}', path: 'build/linux-${{ matrix.isa }}' }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: vectors-${{ matrix.fork }}-${{ needs.key.outputs.generator }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Run the shell test
        if: matrix.fork == 'phase0'
        run: |
          chmod +x build/linux-${{ matrix.isa }}/shell-test
          ${{ matrix.qemu }} build/linux-${{ matrix.isa }}/shell-test "$RUNNER_TEMP"
      - name: Run the binary
        if: matrix.fork == 'phase0'
        run: tests/app/start.sh "${{ matrix.qemu }}" build/linux-${{ matrix.isa }}/lantern-minimal
      - name: Run vectors
        run: |
          set -o pipefail
          chmod +x build/linux-${{ matrix.isa }}/runner-*
          QEMU="${{ matrix.qemu }}" tests/runner/run.sh build/linux-${{ matrix.isa }} vectors \
            | tee results-linux-${{ matrix.isa }}-${{ matrix.fork }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-linux-${{ matrix.isa }}-${{ matrix.fork }}
          path: results-linux-${{ matrix.isa }}-${{ matrix.fork }}.txt

  windows:
    needs: [key, vectors, build]
    strategy:
      fail-fast: false
      matrix:
        fork: [phase0, altair, bellatrix, capella, deneb, electra, fulu]
        isa: [x86_64, arm64]
        include:
          - { isa: x86_64, runs-on: windows-2025 }
          - { isa: arm64,  runs-on: windows-11-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: 'build-windows-${{ matrix.isa }}', path: 'build/windows-${{ matrix.isa }}' }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: vectors-${{ matrix.fork }}-${{ needs.key.outputs.generator }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Run vectors
        shell: pwsh
        run: |
          tests/runner/run.ps1 build/windows-${{ matrix.isa }} vectors | Tee-Object results-windows-${{ matrix.isa }}-${{ matrix.fork }}.txt
          exit $LASTEXITCODE
      - name: Run the shell test and the binary
        if: matrix.fork == 'phase0'
        shell: pwsh
        run: |
          build/windows-${{ matrix.isa }}/shell-test.exe $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit 1 }
          tests/app/start.ps1 build/windows-${{ matrix.isa }}/lantern-minimal.exe
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-windows-${{ matrix.isa }}-${{ matrix.fork }}
          path: results-windows-${{ matrix.isa }}-${{ matrix.fork }}.txt

  macos:
    needs: [key, vectors, build]
    strategy:
      fail-fast: false
      matrix:
        fork: [phase0, altair, bellatrix, capella, deneb, electra, fulu]
        isa: [x86_64, arm64]
        include:
          - { isa: x86_64, runs-on: macos-15-intel }
          - { isa: arm64,  runs-on: macos-15 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: 'build-macos-${{ matrix.isa }}', path: 'build/macos-${{ matrix.isa }}' }
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vectors
          key: vectors-${{ matrix.fork }}-${{ needs.key.outputs.generator }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Run vectors
        run: |
          set -o pipefail
          tests/runner/macos.sh vectors | tee results-macos-${{ matrix.isa }}-${{ matrix.fork }}.txt
      - name: Run the shell test
        if: matrix.fork == 'phase0'
        run: build/macos-${{ matrix.isa }}/shell-test "$RUNNER_TEMP"
      - name: Run the binary
        if: matrix.fork == 'phase0'
        run: tests/app/start.sh "" build/macos-${{ matrix.isa }}/lantern-minimal
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-macos-${{ matrix.isa }}-${{ matrix.fork }}
          path: results-macos-${{ matrix.isa }}-${{ matrix.fork }}.txt

  # Write the tick tables into docs/reference/ from the results of every target and fork
  # (ARCHITECTURE.md section 10). On a push to main, commit them when they changed. When
  # main has moved on, the push is skipped: the newer run writes the tables then.
  results:
    needs: [linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { pattern: results-*, path: results, merge-multiple: true }
      - name: Write the tick tables
        run: python3 -I tests/runner/tick_tables.py results
      - name: Commit the tick tables
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/reference
          if git diff --cached --quiet; then echo "The tick tables did not change."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update the tick tables"
          if ! git push origin HEAD:main; then
            [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ] || exit 1
            echo "main has moved on, so this run does not update the tick tables."
          fi
